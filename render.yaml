services:
  - type: web
    name: free-claude-code-web
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    disk:
      name: fcc-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8082
      - key: HOME
        value: /data
      - key: XDG_CONFIG_HOME
        value: /data/.config
      - key: XDG_DATA_HOME
        value: /data/.local/share
