name: Import Free Claude Code source
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/import-upstream.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: Alishahryar1/free-claude-code
          path: upstream
          fetch-depth: 1
      - name: Copy application source without deleting the checkout
        run: |
          rsync -a \
            --exclude='/.git/' \
            --exclude='/Dockerfile' \
            --exclude='/render.yaml' \
            --exclude='/.github/workflows/import-upstream.yml' \
            upstream/ ./
      - name: Verify imported project
        run: |
          test -f pyproject.toml
          test -f LICENSE
          test -d src
          echo "Source files are present."
      - name: Commit imported source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to import.'
          else
            git commit -m 'Import Free Claude Code application source'
            git push
          fi
